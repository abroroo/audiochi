version: 2.1
orbs:
  node: circleci/node@5

executors:
  node22:
    docker:
      - image: cimg/node:22.11

jobs:
  test:
    executor: node22
    environment:
      CYPRESS_INSTALL_BINARY: "0" # unit tests don't need the Cypress binary
      JEST_JUNIT_OUTPUT_DIR: ./test-results/
    steps:
      - checkout
      - node/install-packages:
          pkg-manager: npm
      - run:
          name: Unit tests
          command: npm run test:ci
      - store_test_results:
          path: ./test-results/

  build:
    executor: node22
    environment:
      CYPRESS_INSTALL_BINARY: "0"
    steps:
      - checkout
      - node/install-packages:
          pkg-manager: npm
      - run:
          name: Production build
          command: npm run build

  preview_deployment:
    executor: node22
    steps:
      - checkout
      - run:
          name: Install Vercel CLI
          command: npm install vercel@latest
      - run:
          name: Pull Vercel Environment Information
          command: npx vercel pull --yes --environment=preview --token=$VERCELTOKEN_FOR_CIRCLE_CI
      - run:
          name: Build Project Artifacts
          command: npx vercel build --token=$VERCELTOKEN_FOR_CIRCLE_CI
      - run:
          name: Deploy Project Artifacts to Vercel
          command: npx vercel deploy --prebuilt --token=$VERCELTOKEN_FOR_CIRCLE_CI

  production_deployment:
    executor: node22
    steps:
      - checkout
      - run:
          name: Install Vercel CLI
          command: npm install vercel@latest
      - run:
          name: Pull Vercel Environment Information
          command: npx vercel pull --yes --environment=production --token=$VERCELTOKEN_FOR_CIRCLE_CI
      - run:
          name: Build Project Artifacts
          command: npx vercel build --prod --token=$VERCELTOKEN_FOR_CIRCLE_CI
      - run:
          name: Deploy Project Artifacts to Vercel
          command: npx vercel deploy --prebuilt --prod --token=$VERCELTOKEN_FOR_CIRCLE_CI

workflows:
  build-and-test:
    jobs:
      - test
      - build:
          requires:
            - test
      - preview_deployment:
          requires:
            - build
          filters:
            branches:
              ignore: /main/
      - production_deployment:
          requires:
            - build
          filters:
            branches:
              only: /main/
