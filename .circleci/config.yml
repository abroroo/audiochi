version: 2.1
orbs:
  node: circleci/node@5

executors:
  node22:
    docker:
      - image: cimg/node:22.11

jobs:
  test:
    executor: node22
    environment:
      CYPRESS_INSTALL_BINARY: "0" # unit tests don't need the Cypress binary
      JEST_JUNIT_OUTPUT_DIR: ./test-results/
    steps:
      - checkout
      - node/install-packages:
          pkg-manager: npm
      - run:
          name: Unit tests
          command: npm run test:ci
      - store_test_results:
          path: ./test-results/

  build:
    executor: node22
    environment:
      CYPRESS_INSTALL_BINARY: "0"
    steps:
      - checkout
      - node/install-packages:
          pkg-manager: npm
      - run:
          name: Production build
          command: npm run build

# Deploys are handled by Vercel's GitHub integration; CircleCI only tests and builds.
workflows:
  build-and-test:
    jobs:
      - test
      - build:
          requires:
            - test
