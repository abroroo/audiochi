[project]
name = "audiochi-train"
version = "0.1.0"
description = "Training, evaluation and export pipeline for the Audiochi in-browser sound classifier"
requires-python = ">=3.11,<3.13"
dependencies = [
  "torch==2.9.1",
  "numpy>=1.26,<3",
  "scipy>=1.13",
  "soundfile>=0.12",
  "pandas>=2.2",
  "scikit-learn>=1.5",
  "matplotlib>=3.9",
  "tqdm>=4.66",
  "onnx>=1.17",
  "onnxruntime>=1.20",
  "onnxscript>=0.1",
  "torchlibrosa==0.1.0",
  "librosa>=0.10.2",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
